<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Knowledge accuracy for three stacks over 1,100 pinned items, with one-standard-error whiskers: Kolibri-1 81.9 percent, Qwen3.6 88.5 percent, Strata Q2_0 89.7 percent. The top two are 1.2 points apart against a 1.33-point paired standard error.">
  <title>Knowledge on 1,100 pinned items: the top two stacks are indistinguishable</title>
  <desc>Bars for three stacks with plus/minus one binomial standard error. Kolibri-1 78B 81.9 percent, Qwen3.6-35B-A3B 88.5 percent, Strata Q2_0 89.7 percent. The gap between the top two is 1.2 points, smaller than the 1.33-point paired standard error.</desc>
  <rect x="0" y="0" width="720" height="330" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="24" y="34" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Knowledge: 1,100 pinned items (800 MMLU + 300 GSM8K), accuracy with &#177;1 binomial SE</text>
  <text x="24" y="54" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">temperature 0, seed 20261009, identical items to every stack, no judge model</text>

  <!-- gridlines -->
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="96" y1="78.6" x2="672" y2="78.6"/>
    <line x1="96" y1="150" x2="672" y2="150"/>
    <line x1="96" y1="221.4" x2="672" y2="221.4"/>
    <line x1="96" y1="250" x2="672" y2="250" stroke="#8c959f"/>
  </g>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="end">
    <text x="88" y="82.6">90%</text>
    <text x="88" y="154">85%</text>
    <text x="88" y="225.4">80%</text>
  </g>

  <!-- bars -->
  <g>
    <rect x="120" y="194.3" width="96" height="55.7" fill="#d97706"/>
    <rect x="300" y="100" width="96" height="150" fill="#2f6fd0"/>
    <rect x="480" y="82.9" width="96" height="167.1" fill="#2f6fd0" opacity="0.72"/>
  </g>

  <!-- whiskers -->
  <g stroke="#1f2328" stroke-width="1.6">
    <line x1="168" y1="177.7" x2="168" y2="210.9"/><line x1="158" y1="177.7" x2="178" y2="177.7"/><line x1="158" y1="210.9" x2="178" y2="210.9"/>
    <line x1="348" y1="86.3" x2="348" y2="113.7"/><line x1="338" y1="86.3" x2="358" y2="86.3"/><line x1="338" y1="113.7" x2="358" y2="113.7"/>
    <line x1="528" y1="69.7" x2="528" y2="96"/><line x1="518" y1="69.7" x2="538" y2="69.7"/><line x1="518" y1="96" x2="538" y2="96"/>
  </g>

  <!-- value labels -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">
    <text x="168" y="168">81.9%</text>
    <text x="348" y="77">88.5%</text>
    <text x="528" y="60">89.7%</text>
  </g>

  <!-- category labels -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">
    <text x="168" y="272">Kolibri-1 78B</text>
    <text x="168" y="288" font-size="11" fill="#57606a">Q3_K_M, own runtime</text>
    <text x="348" y="272">Qwen3.6-35B-A3B Q4_K_M</text>
    <text x="348" y="288" font-size="11" fill="#57606a">llama.cpp, 131,072, cpu-moe</text>
    <text x="528" y="272">Qwen3.8-Flash-Next Q2_0</text>
    <text x="528" y="288" font-size="11" fill="#57606a">Strata, 65,536, 4 GiB resident</text>
  </g>

  <text x="24" y="316" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">The top two are <tspan font-weight="600">1.2 points apart against a 1.33-point paired standard error</tspan> - indistinguishable. Kolibri is 6.6 points behind both.</text>
</svg>
